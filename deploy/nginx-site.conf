# ============================================================
# Vishvu Tech 2.0 — nginx site configuration
# Target: Oracle Cloud Always Free (ARM) · Ubuntu 24.04 · nginx 1.24+
# Behind: Cloudflare (proxy ON, Full-Strict, Origin CA certificate)
# ============================================================

# ---- Rate limiting zones ----
limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

# ---- Cloudflare real IP restoration ----
# Update ranges from https://www.cloudflare.com/ips/ when they change
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name vishvutech.com www.vishvutech.com;
    return 301 https://vishvutech.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vishvutech.com www.vishvutech.com;

    # ---- TLS: Cloudflare Origin CA cert (15-year, free) ----
    # Generate in Cloudflare dash: SSL/TLS > Origin Server > Create Certificate
    ssl_certificate     /etc/nginx/ssl/vishvutech-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/vishvutech-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # www → apex
    if ($host = www.vishvutech.com) { return 301 https://vishvutech.com$request_uri; }

    root /var/www/vishvutech;
    index index.html;

    # ---- Performance ----
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    # brotli_static serves pre-compressed .br files at deploy time
    # (apt install nginx-module-brotli; if unavailable, gzip covers you)
    # brotli_static on;

    # ---- Security headers (grade-A target) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # ---- Caching: hashed assets immutable, HTML always fresh ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }
    location ~* \.(svg|woff2|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        limit_req zone=general burst=10 nodelay;
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- Contact API proxy (systemd: contact-api.service on :8081) ----
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 64k;
    }

    # ---- Health endpoint for uptime monitoring ----
    location = /api/health {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    # ---- Custom 404 (our styled page) ----
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Hide server tokens ----
    server_tokens off;
}
